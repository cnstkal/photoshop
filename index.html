<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PhotoLite</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}
:root{--bg:#202020;--panel:#252525;--panel2:#2d2d2d;--line:#111;--text:#eee;--muted:#aaa;--hover:#3a3a3a;--accent:#4b86d1;--work:#333}
body.light{--bg:#f3f3f3;--panel:#fff;--panel2:#f0f0f0;--line:#d6d6d6;--text:#222;--muted:#666;--hover:#e5e5e5;--work:#d9d9d9}
body{font-family:Pretendard,system-ui,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
button,input,select{font:inherit}.app{height:100vh;display:grid;grid-template-rows:42px 1fr 28px}
.topbar{background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 10px;gap:14px}
.brand{font-weight:700;font-size:14px;white-space:nowrap}.menus{display:flex;height:100%}
.menu{position:relative;height:100%}.menu>button{height:100%;border:0;background:transparent;color:var(--text);padding:0 11px;cursor:pointer}
.menu>button:hover,.menu.open>button{background:var(--hover)}
.dropdown{display:none;position:absolute;top:42px;left:0;min-width:190px;background:var(--panel);border:1px solid var(--line);box-shadow:0 8px 22px #0007;padding:5px;z-index:100}
.menu.open .dropdown{display:block}.dropdown button{display:flex;width:100%;justify-content:space-between;align-items:center;border:0;background:transparent;color:var(--text);padding:8px 10px;border-radius:4px;text-align:left;cursor:pointer;font-size:13px}
.dropdown button:hover{background:var(--hover)}.shortcut{color:var(--muted);font-size:11px}.sep{height:1px;background:var(--line);margin:4px}
.workspace{min-height:0;display:grid;grid-template-columns:54px minmax(0,1fr) 290px}
.toolbar{background:var(--panel);border-right:1px solid var(--line);padding:7px 5px;display:flex;flex-direction:column;align-items:center;gap:5px;position:relative;z-index:50;overflow:visible}
.tool{width:42px;height:42px;border:0;border-radius:5px;background:transparent;color:var(--text);cursor:pointer;display:grid;place-items:center}.tool:hover,.tool.active{background:var(--hover)}
.tool svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.separator{height:1px;background:var(--line);width:36px;margin:4px 0}
.center{min-width:0;min-height:0;background:var(--work);display:grid;grid-template-rows:38px 1fr}
.options{background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 12px;font-size:12px;overflow:auto;white-space:nowrap}
.options label{display:flex;align-items:center;gap:6px}.options input[type=range]{width:100px}
.shapeOptions{display:none;align-items:center;gap:10px}.shapeOptions.show{display:flex}
#selectionOptions.show,#gradientOptions.show{display:flex!important}
#selectionOptions label,#gradientOptions label{display:flex;align-items:center;gap:5px}
#selectionOptions select,#gradientOptions select{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:4px;padding:4px}.shapeOptions label{display:flex;align-items:center;gap:5px}
.shapeOptions input[type=number]{width:58px;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:4px;padding:4px}.shapeOptions input[type=color]{width:34px;height:26px;padding:0;border:0}
.modalBack{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:500}.modalBack.show{display:flex}
.textModal{width:min(460px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line);box-shadow:0 18px 50px #0009;border-radius:8px;overflow:hidden}
.textModal h3{margin:0;padding:14px 16px;background:var(--panel2);font-size:14px}.textModalBody{padding:16px}.textModal textarea{width:100%;min-height:110px;resize:vertical;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:5px;padding:10px;outline:none}
.textGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.textGrid label{display:flex;flex-direction:column;gap:5px;font-size:11px;color:var(--muted)}.textGrid input,.textGrid select{background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:4px;padding:7px}
.textChecks{display:flex;gap:14px;margin-top:12px;font-size:12px}.textChecks label{display:flex;align-items:center;gap:5px}.modalBack .textModal label{font-size:13px}.modalActions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.modalActions button{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:5px;padding:8px 14px;cursor:pointer}.modalActions .primary{background:var(--accent);border-color:var(--accent);color:#fff}
.options button{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:4px;padding:5px 8px;cursor:pointer}
.canvasWrap{overflow:auto;position:relative;padding:24px;background:var(--work);display:flex;align-items:flex-start;justify-content:center}
#canvas{background:var(--canvas-bg,#fff);box-shadow:0 8px 30px #0008;touch-action:none;cursor:default}
#overlay{position:absolute;pointer-events:none;z-index:2}
.side{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.panel{border-bottom:1px solid var(--line)}.panel h3{margin:0;padding:10px 12px;font-size:12px;background:var(--panel2)}
.panelBody{padding:10px 12px}.row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin-bottom:8px;font-size:12px}.row input[type=range]{width:145px}.row select{width:145px;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:4px;padding:5px}.row input[type=color]{width:58px;height:28px;padding:0;border:0}
.layers{max-height:280px;overflow:auto}.layer{cursor:pointer;user-select:none}.layer.dragging{opacity:.45}.layer.dragOver{outline:1px solid var(--accent);outline-offset:-1px}.danger{color:#ff8a8a}
.layer{display:flex;align-items:center;gap:8px;background:var(--panel2);padding:8px;font-size:12px;cursor:pointer;border-bottom:1px solid var(--line)}.layer .thumb{width:28px;height:28px;background:repeating-conic-gradient(#ddd 0 25%,#fff 0 50%) 50%/8px 8px;border-radius:2px}.layer.active{outline:1px solid var(--accent);outline-offset:-1px}
.layer .eye{margin-left:auto;border:0;background:transparent;color:var(--text);cursor:pointer}.layer .lock{border:0;background:transparent;color:var(--text);cursor:pointer}.side button.action{width:100%;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:5px;padding:7px;cursor:pointer}.textPanel{display:none}.textPanel.show{display:block}.textPanel input,.textPanel select,.textPanel textarea{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:4px;padding:6px}.textPanel textarea{min-height:80px;resize:vertical}
.status{background:var(--panel);border-top:1px solid var(--line);display:flex;align-items:center;padding:0 10px;color:var(--muted);font-size:11px;gap:16px}
.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:15px;pointer-events:none}.hidden{display:none!important}
.fileInput{display:none}
#cursorPreview{position:fixed;border:1.5px solid #4b86d1;border-radius:50%;pointer-events:none;z-index:900;box-shadow:0 0 0 1px #fff9;transform:translate(-50%,-50%);display:none}
.tool{position:relative}.tool[data-tip]::after{content:attr(data-tip);position:absolute;left:52px;top:50%;transform:translateY(-50%);background:#181818;color:#fff;border:1px solid #444;border-radius:4px;padding:6px 9px;font-size:11px;line-height:1;white-space:nowrap;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .08s;z-index:10000;box-shadow:0 4px 14px #0008}.tool[data-tip]:hover::after,.tool[data-tip]:focus-visible::after{opacity:1;visibility:visible}
.newDocModal{width:min(500px,calc(100vw - 32px))}.newDocSizeGrid{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:10px}.newDocSizeGrid label,.newDocBgRow label,.newDocRow label{display:flex;flex-direction:column;gap:6px;font-size:11px;color:var(--muted)}.newDocSizeGrid input[type=number]{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:5px;padding:9px}.newDocSizeX{padding-bottom:10px;color:var(--muted);font-weight:700}.newDocBgRow{margin-top:14px}.newDocBgRow input[type=color]{width:100%;height:38px;padding:2px;border:1px solid var(--line);background:var(--bg);border-radius:5px}.newDocRow{margin-top:14px}.newDocRow label{display:flex;flex-direction:row;align-items:center;color:var(--text);font-size:12px}.newDocRow input[type=range]{flex:1}.newDocRow span{color:var(--muted);min-width:32px;text-align:right}.newDocBgRow.disabled{opacity:.45}
.layer[draggable=true]{cursor:grab}.layer.dragOver{outline:2px solid var(--accent);outline-offset:-2px}
@media(max-width:900px){.workspace{grid-template-columns:48px minmax(0,1fr)}.side{display:none}.options{overflow:auto}.canvasWrap{padding:12px}
#mobilePanelToggle{display:grid!important}
.side.mobileShow{display:flex!important;position:fixed;right:0;top:42px;bottom:28px;width:min(82vw,320px);z-index:80;box-shadow:-8px 0 24px #0008;overflow:auto}
}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="brand">PhotoLite</div>
  <nav class="menus">
    <div class="menu"><button data-menu="file">파일</button><div class="dropdown">
      <button data-action="new">새 문서 <span class="shortcut">Ctrl+N</span></button>
      <button data-action="open">열기 <span class="shortcut">Ctrl+O</span></button>
      <button data-action="save">PNG로 저장 <span class="shortcut">Ctrl+S</span></button><button data-action="saveJpg">JPG로 저장</button><button data-action="saveWebp">WEBP로 저장</button><div class="sep"></div><button data-action="importLayer">이미지를 레이어로 가져오기 <span class="shortcut">Ctrl+V</span></button>
    </div></div>
    <div class="menu"><button data-menu="edit">편집</button><div class="dropdown">
      <button data-action="undo">실행 취소 <span class="shortcut">Ctrl+Z</span></button>
      <button data-action="redo">다시 실행 <span class="shortcut">Ctrl+Shift+Z</span></button>
      <button data-action="clear">전체 지우기</button>
    </div></div>
    <div class="menu"><button data-menu="image">이미지</button><div class="dropdown">
      <button data-action="rotateL">왼쪽으로 90°</button><button data-action="rotateR">오른쪽으로 90°</button>
      <button data-action="flipH">좌우 반전</button><button data-action="flipV">상하 반전</button><div class="sep"></div><button data-action="resizeImg">이미지 크기 조절…</button>
    </div></div>
    <div class="menu"><button data-menu="layer">레이어</button><div class="dropdown">
      <button data-action="newLayer">새 레이어 <span class="shortcut">Ctrl+Shift+N</span></button>
      <button data-action="deleteLayer">레이어 삭제</button>
      <button data-action="mergeDown">아래 레이어와 병합 <span class="shortcut">Ctrl+E</span></button><button data-action="dupLayer">레이어 복제 <span class="shortcut">Ctrl+J</span></button><button data-action="layerUp">위로 이동</button><button data-action="layerDown">아래로 이동</button><button data-action="renameLayer">이름 바꾸기</button>
    </div></div>
    <div class="menu"><button data-menu="filter">필터</button><div class="dropdown">
      <button data-action="gray">흑백</button><button data-action="invert">반전</button><button data-action="bright">밝게</button><button data-action="sepia">세피아</button><div class="sep"></div><button data-action="adjust">색 보정 · 블러…</button>
    </div></div>
    <div class="menu"><button data-menu="view">보기</button><div class="dropdown">
      <button data-action="fit">화면에 맞춤</button><button data-action="zoom50">50%</button><button data-action="zoom100">100%</button><button data-action="zoom200">200%</button>
      <div class="sep"></div><button data-action="theme">화이트 모드 전환</button>
    </div></div>
  </nav>
  <button id="mobilePanelToggle" class="tool" style="margin-left:auto;display:none" title="패널">☰</button>
</header>
<div class="workspace">
  <aside class="toolbar">
<button class="tool active" data-tool="move" title="선택/이동"><svg viewBox="0 0 24 24"><path d="m5 3 14 9-7 2-3 7z"/><path d="m12 14 4 6"/></svg></button>
<button class="tool" data-tool="rectSelect" title="선택"><svg viewBox="0 0 24 24" stroke-dasharray="3 2"><rect x="4" y="5" width="16" height="14"/></svg></button>
<button class="tool" data-tool="crop" title="자르기 (C)"><svg viewBox="0 0 24 24"><path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M2 6h14a2 2 0 0 1 2 2v14"/></svg></button>
<button class="tool" data-tool="brush" title="브러시"><svg viewBox="0 0 24 24"><path d="M15 6 18 3l3 3-3 3"/><path d="m14 7-7 7"/><path d="M5 21c2-3 5-2 6-5"/><path d="M3 18c1-1 2-1 3 0"/></svg></button>
<button class="tool" data-tool="eraser" title="지우개"><svg viewBox="0 0 24 24"><path d="m7 16 9-9 4 4-9 9H7l-4-4 4-4"/><path d="m14 19 7-7"/></svg></button>
<button class="tool" data-tool="eyedropper" title="스포이드"><svg viewBox="0 0 24 24"><path d="m14 4 6 6"/><path d="m13 5 6 6-7 7H7v-5z"/><path d="m4 20 3-3"/></svg></button>
<button class="tool" data-tool="gradient" title="그라디언트"><svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="8" fill="url(#gg)" stroke="currentColor"/><defs><linearGradient id="gg" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity=".2"/><stop offset="1" stop-color="#fff" stop-opacity=".9"/></linearGradient></defs></svg></button>
<button class="tool" data-tool="fill" title="페인트통"><svg viewBox="0 0 24 24"><path d="m5 4 8 8-5 5-8-8z"/><path d="m13 12 4-4 4 4-4 4"/><path d="M14 17c2-2 5-1 6 2-2 2-5 2-6-2Z"/></svg></button>
<button class="tool" data-tool="text" title="문자"><svg viewBox="0 0 24 24"><path d="M4 5h16"/><path d="M12 5v14"/><path d="M8 19h8"/></svg></button>
<button class="tool" data-tool="shape" data-tip="도형" title="도형"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="1"/><circle cx="17" cy="17" r="3"/></svg></button>
<button class="tool" data-tool="hand" title="손 도구 / 화면 이동 (H, Space)"><svg viewBox="0 0 24 24"><path d="M8 13V6a1.5 1.5 0 0 1 3 0v5"/><path d="M11 11V4.5a1.5 1.5 0 0 1 3 0V11"/><path d="M14 11V6a1.5 1.5 0 0 1 3 0v7"/><path d="M8 13l-1.5-2a1.5 1.5 0 0 0-2.3 1.9L8 19a5 5 0 0 0 4 2h2a5 5 0 0 0 5-5v-3"/></svg></button>
    <div class="separator"></div>
    <button class="tool" id="fit" title="화면에 맞춤"><svg viewBox="0 0 24 24"><path d="M4 9V5h4"/><path d="M20 9V5h-4"/><path d="M4 15v4h4"/><path d="M20 15v4h-4"/></svg></button>
  </aside>
  <main class="center">
    <div class="options">
      <label>도구 <b id="toolName">이동</b></label>
      <label id="brushSizeWrap">크기 <input id="brushSize" type="range" min="1" max="120" value="20"><span id="sizeVal">20</span></label>
      <label id="hardnessWrap">경도 <input id="brushHardness" type="range" min="0" max="100" value="100"><span id="hardVal">100%</span></label>
      <label id="colorWrap">색 <input id="color" type="color" value="#111111"></label>
      <label id="brushTypeWrap" style="display:none">브러시 <select id="brushType">
        <option value="basic">기본</option><option value="pencil">연필</option><option value="soft">소프트</option><option value="airbrush">에어브러시</option><option value="marker">마커</option><option value="ink">잉크</option><option value="chalk">분필</option>
      </select></label>
      <div id="selectionOptions" style="display:none;align-items:center;gap:10px">
        <label>모양 <select id="selectionShape"><option value="rect">사각형</option><option value="circle">원</option></select></label>
        <label>선택 <select id="selMode"><option value="new">새로</option><option value="add">추가</option><option value="sub">빼기</option></select></label>
      </div>
      <button id="selClear" style="display:none">선택 해제</button>
      <div id="gradientOptions" style="display:none;align-items:center;gap:10px">
        <label>그라디언트 <select id="gradientPreset">
          <option value="custom">사용자 지정</option><option value="mono">검정 → 흰색</option><option value="ocean">파랑 → 청록</option><option value="sunset">주황 → 분홍</option><option value="purple">보라 → 파랑</option><option value="mint">민트 → 하늘</option><option value="night">남색 → 보라</option>
        </select></label>
        <label>시작 <input id="gradientStartColor" type="color" value="#111111"></label>
        <label>끝 <input id="gradientEndColor" type="color" value="#ffffff"></label>
      </div><label id="cropRatioWrap" style="display:none">비율 <select id="cropRatio"><option value="free">자유</option><option value="1:1">1 : 1</option><option value="4:3">4 : 3</option><option value="3:4">3 : 4</option><option value="16:9">16 : 9</option><option value="9:16">9 : 16</option><option value="3:2">3 : 2</option><option value="2:3">2 : 3</option></select></label>
<div id="shapeOptions" class="shapeOptions">
<label>모양 <select id="shapeType"><option value="rect">사각형</option><option value="circle">원</option><option value="triangle">삼각형</option><option value="polygon">다각형</option><option value="star">별</option><option value="line">직선</option></select></label>
<label id="sidesWrap" style="display:none">각 <input id="shapeSides" type="number" min="3" max="20" value="5" style="width:52px"></label>
<label>채우기 <input id="fillShape" type="checkbox" checked></label>
<label>테두리 <input id="strokeShape" type="checkbox" checked></label>
<label>색 <input id="shapeColor" type="color" value="#111111"></label>
<label>두께 <input id="strokeWidth" type="number" min="0" max="100" value="4"></label>
<label>모서리 <input id="cornerRadius" type="number" min="0" max="500" value="0"></label>
<span style="color:var(--muted)">회전은 선택툴로 조절</span></div>
<button id="clear">전체 지우기</button>
    </div>
    <div class="canvasWrap" id="wrap"><div class="empty" id="empty">이미지를 열거나, 끌어다 놓거나, 붙여넣기(Ctrl+V) 하세요</div><canvas id="canvas"></canvas><canvas id="overlay"></canvas></div>
    <div id="cursorPreview"></div>
  </main>
  <aside class="side">
    <section class="panel"><h3>도구 옵션</h3><div class="panelBody"><div class="row"><span>불투명도</span><span id="opacityVal">100%</span></div><input id="opacity" type="range" min="1" max="100" value="100" style="width:100%"><div class="row" style="margin-top:10px"><span>혼합 모드</span><select id="blendMode"><option value="source-over">일반</option><option value="multiply">곱하기</option><option value="screen">스크린</option><option value="overlay">오버레이</option><option value="darken">어둡게</option><option value="lighten">밝게</option><option value="hard-light">하드 라이트</option><option value="soft-light">소프트 라이트</option><option value="difference">차이</option><option value="exclusion">제외</option><option value="color-dodge">색상 닷지</option><option value="color-burn">색상 번</option></select></div></div></section>
    <section class="panel"><h3>레이어</h3><div class="panelBody"><div id="layers" class="layers"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px"><button id="newLayerBtn" class="action">+ 새 레이어</button><button class="action" data-action="importLayer">이미지+</button></div><button id="trashLayerBtn" class="action danger" title="선택한 레이어 삭제" style="width:100%;margin-top:6px">🗑 레이어 삭제</button></div></section>
<section id="textPanel" class="panel textPanel"><h3>텍스트</h3><div class="panelBody">
<div class="row"><span>글자 크기</span><input id="textPanelSize" type="number" min="1" max="1000" value="48"></div>
<div class="row"><span>색상</span><input id="textPanelColor" type="color" value="#111111"></div>
<div class="row"><span>폰트</span><select id="textPanelFont"><option value="Pretendard">Pretendard</option><option value="Arial">Arial</option><option value="Helvetica">Helvetica</option><option value="Georgia">Georgia</option><option value="Times New Roman">Times New Roman</option><option value="Courier New">Courier New</option><option value="Noto Sans KR">Noto Sans KR</option><option value="Nanum Gothic">Nanum Gothic</option><option value="serif">Serif</option><option value="sans-serif">Sans Serif</option></select></div>
<div class="row"><span>두께</span><select id="textPanelWeight"><option value="300">Light</option><option value="400">Regular</option><option value="500">Medium</option><option value="600">SemiBold</option><option value="700">Bold</option><option value="800">ExtraBold</option><option value="900">Black</option></select></div>
<div class="row"><span>자간</span><input id="textPanelSpacing" type="number" min="-20" max="100" step="0.5" value="0"></div>
<div class="row"><span>정렬</span><select id="textPanelAlign"><option value="left">왼쪽</option><option value="center">가운데</option><option value="right">오른쪽</option></select></div>

let draggedLayerIndex=null,styleTarget=null;

function sizeOverlay(){overlay.width=canvas.width;overlay.height=canvas.height;overlay.style.width=canvas.style.width;overlay.style.height=canvas.style.height}

  else if(k.startsWith('arrow')&&selectedShape&&!selectedShape.locked&&tool==='move'){e.preventDefault();const d=e.shiftKey?10:1,m=objectMeta(selectedShape);checkpoint();m.x+=k==='arrowright'?d:k==='arrowleft'?-d:0;m.y+=k==='arrowdown'?d:k==='arrowup'?-d:0;redrawObject(selectedShape);render();persist()}
});
document.addEventListener('keydown',e=>{if(e.key==='Shift'){window.__shapeShift=true;window.__selectionShift=true}});
document.addEventListener('keyup',e=>{if(e.key==='Shift'){window.__shapeShift=false;window.__selectionShift=false;}if(e.key===' '){spaceDown=false;canvas.style.cursor=tool==='hand'?'grab':''}});
setTool('move');if(layers.length&&!selectedLayers.size)selectedLayers.add(active);renderLayers();syncLayerControls();sizeOverlay();loadPersisted();
</script>
</body>
</html>
